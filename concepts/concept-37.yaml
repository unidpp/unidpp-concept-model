  id: 37
  term: "passive twin"
  definition: "digital twin reconstructed from point-in-time attestations about the object, sampled when the object visits an attestor, in which truth is episodic and staleness between attestations is unbounded and undetectable"
  language_code: eng
  notes:
  - "Corresponds to capability classes S0 (silent, testimony-only) and S1 (passive authentication)."
  - "Trust rides entirely on attestor authority; the twin is testimonial by default and sensorial by exception."
