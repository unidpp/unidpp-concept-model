  term: "lens"
  definition: "profile conceived as a calibrated measuring instrument placed on the digital twin, which selects and transforms without altering the observed scene"
  language_code: eng
  notes:
  - "The mount, the profile interface on the neutral core, is the standardized element: any registered lens by any maker attaches to it."
  - "A lens publishes its calibration (version and cited rules), its uncertainty and its decision rules; it is subject to pattern approval at registration and to periodic re-verification through conformance runs."
  - "Verification path-finds from any render through the lens and its fact chain to an anchor in the verifier's trust bundle."
