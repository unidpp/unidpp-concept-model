  id: 39
  term: "truth mode"
  definition: "declared per-data-element attribute of a profile stating which truth source the element requires, namely attest-sampled, self-committed, or both with a precedence rule"
  language_code: eng
  notes:
  - "The passive twin (concept dpp-0132) supplies attest-sampled truth and the active twin (concept dpp-0133) supplies self-committed truth; both paradigms coexist permanently in the framework."
  - "Precedence between a calibrated device measurement and an attestor observation is itself a metrological hierarchy question."
  - "Freshness and verification requirements must be satisfiable by the subject's capability class: demanding live freshness from an S0 (silent) product is an unsatisfiable profile."
