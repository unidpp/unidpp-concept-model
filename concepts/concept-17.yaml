  term: "transformation event"
  definition: "typed event in the provenance directed acyclic graph that records the split of one passport into many, or the combination or transformation of many passports into one"
  language_code: eng
  notes:
  - "The output issuance event carries input references of passport, quantity and as-of state hash, so the new passport hash-links its sources."
  - "Quantities resulting from a transformation are new measured facts with provenance \"computed by transformation event\", never copies; mass balance is auditable as input minus output equals loss."
  - "Inputs transition to consumed or transformed status: historical, still verifiable, still needed for as-of queries."
