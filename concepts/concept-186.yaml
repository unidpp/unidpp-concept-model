eng:
  id: 186
  term: "digital representation"
  definition: "information and services representing an entity from a given viewpoint [example] -- Examples of information are properties (e.g. maximum temperature), actual parameters (e.g. actual velocity), events (e.g. notification of status change), schematics (electrical), and visualization information (2D and 3D drawings). -- [example] -- Examples of services are asset services (for example providing the history of the configuration data or providing the actual velocity) and asset related services (for example providing a simulation). -- [example] -- Examples of viewpoints are mechanical, electrical, or commercial characteristics. --"
