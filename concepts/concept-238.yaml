---
term: "as-of state"
termid: 238
eng:
  id: 238
  term: "as-of state"
  definition: "state of a subject reconstructed from its event-sourced record at a specified past time, anchored by a notarized snapshot so that queries can answer what was legally true at that time"
  language_code: eng
  notes:
  - "The two authoritative query modes are the live view (freshness-labelled) and the notarized as-of snapshot (log-anchored); legal purpose selects the mode."
  - "Transformation events hash-link their inputs by as-of state hash, and profile-version bindings recorded as lifecycle events make manifest history as-of-reconstructable, answering questions such as whether a product was compliant when sold."
  - "Mirrors and caches are always as-of stamped; the projection is computed from the record, so as-of queries are reproducible."
