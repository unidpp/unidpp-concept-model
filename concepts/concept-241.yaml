  definition: "carrier-embedded minimum viable passport, comprising the product identifier, the resolver URI, the economic operator identifier, the status, the critical safety or recall flag, the validity and multi-suite compressed signatures, sized to the data carrier and verifiable offline against pre-cached trust anchors"
