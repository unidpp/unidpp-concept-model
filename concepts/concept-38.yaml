eng:
  id: 38
  term: "active twin"
  definition: "digital twin in which the object self-reports under device keys, making truth near-continuous, freshness bounded and detectable, and shifting the binding question from who saw the object to who attests the sensor"
  language_code: eng
  notes:
  - "Corresponds to capability classes S2 (logged contact) and S3 (connected)."
  - "Measurement validity becomes load-bearing: sensor calibration, uncertainty of self-reported values and registered units; health status is a derived verdict."
  - "Profiles declare, per data element, the required truth mode, namely attest-sampled, self-committed, or both with precedence."
