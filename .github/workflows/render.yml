name: render
on: [push, pull_request]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Install GraphViz (the PNG engine shells out to dot)
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: model-diagrams
          path: images/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone the vocabulary draft (public)
        run: git clone --depth 1 https://github.com/CalConnect/cc-dpp-vocabulary.git /tmp/vocab
      - run: python3 scripts/check-concepts.py
        env:
          CC_DPP_VOCAB: /tmp/vocab
      - run: python3 scripts/build-site.py
